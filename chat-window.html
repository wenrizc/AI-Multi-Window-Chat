<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="chat__windowPageTitle">AI Chat Window</title>
  <link rel="stylesheet" href="dist/katex/katex.min.css">
  <link rel="stylesheet" href="chat-window.css">
</head>
<body>
  <div class="chat-container">
    <div class="messages-container" id="messagesContainer">
      <div class="welcome-message">
        <div class="welcome-icon">💬</div>
        <div class="welcome-text" data-i18n="chat__welcome">Start Chatting</div>
        <div class="welcome-hint" data-i18n="chat__welcomeHint">Enter a question to start chatting with AI</div>
      </div>
    </div>

    <div class="chat-settings-panel" id="settingsPanel" hidden>
      <div class="chat-settings-grid">
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__settingsModel">Model</span>
          <select id="profileSelect" data-i18n-title="chat__btnSwitchConfig" title="Switch Config">
            <option value=""></option>
          </select>
        </label>
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__settingsPrompt">Prompt</span>
          <select id="promptSelect">
            <option value="" data-i18n="prompt__noPrompt">No Prompt</option>
          </select>
        </label>
        <label class="chat-settings-toggle" for="searchToggle">
          <input type="checkbox" id="searchToggle">
          <span class="chat-settings-toggle-copy">
            <span class="chat-settings-label" data-i18n="chat__settingsSearch">Search</span>
            <span class="chat-settings-value" data-i18n="chat__searchToggle">Web Search</span>
          </span>
        </label>
        <label class="chat-settings-toggle" for="streamingToggle">
          <input type="checkbox" id="streamingToggle">
          <span class="chat-settings-toggle-copy">
            <span class="chat-settings-label" data-i18n="chat__settingsStreaming">Response</span>
            <span class="chat-settings-value" data-i18n="chat__streamingToggle">Streaming</span>
          </span>
        </label>
      </div>
    </div>

    <div class="chat-status-bar">
      <div id="statusText" class="chat-status-text" data-i18n="chat__statusIdle">Idle</div>
      <button id="stopBtn" class="stop-btn" type="button" data-i18n="chat__btnStop">Stop</button>
    </div>

    <div class="input-container">
      <textarea id="messageInput" rows="1"></textarea>
      <button id="sendBtn" class="send-btn" data-i18n-title="chat__btnSend" title="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

    <div class="loading-indicator" id="loadingIndicator" style="display: none;">
      <div class="loading-text" data-i18n="chat__thinking">AI is thinking...</div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="dist/chat-window.js"></script>
</body>
</html>
