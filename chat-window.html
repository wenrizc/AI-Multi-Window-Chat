<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="chat__windowPageTitle">AI Chat Window</title>
  <link rel="stylesheet" href="dist/katex/katex.min.css">
  <link rel="stylesheet" href="chat-window.css">
</head>
<body>
  <div class="chat-container">
    <div class="messages-container" id="messagesContainer">
      <div class="welcome-message">
        <div class="welcome-icon">💬</div>
        <div class="welcome-text" data-i18n="chat__welcome">Start Chatting</div>
        <div class="welcome-hint" data-i18n="chat__welcomeHint">Enter a question to start chatting with AI</div>
      </div>
    </div>

    <div class="chat-settings-panel chat-settings-popover" id="settingsPanel" role="dialog" aria-modal="false" aria-labelledby="settingsPanelTitle" hidden>
      <div class="chat-settings-header">
        <span id="settingsPanelTitle" class="chat-settings-title" data-i18n="content__btnSettings">Settings</span>
        <button id="settingsCloseBtn" class="chat-settings-close" type="button" data-i18n-title="content__btnClose" data-i18n-aria-label="content__btnClose" title="Close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
      <div class="chat-settings-grid">
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__settingsModel">Model</span>
          <select id="profileSelect" data-i18n-title="chat__btnSwitchConfig" title="Switch Config">
            <option value=""></option>
          </select>
        </label>
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__settingsPrompt">Prompt</span>
          <select id="promptSelect">
            <option value="" data-i18n="prompt__noPrompt">No Prompt</option>
          </select>
        </label>
        <label class="chat-settings-toggle" for="searchToggle">
          <input type="checkbox" id="searchToggle">
          <span class="chat-settings-toggle-copy">
            <span class="chat-settings-label" data-i18n="chat__settingsSearch">Search</span>
            <span class="chat-settings-value" data-i18n="chat__searchToggle">Web Search</span>
          </span>
        </label>
        <label class="chat-settings-toggle" for="streamingToggle">
          <input type="checkbox" id="streamingToggle">
          <span class="chat-settings-toggle-copy">
            <span class="chat-settings-label" data-i18n="chat__settingsStreaming">Response</span>
            <span class="chat-settings-value" data-i18n="chat__streamingToggle">Streaming</span>
          </span>
        </label>
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__settingsReasoning">Thinking intensity</span>
          <select id="reasoningEffortSelect">
            <option value="default" data-i18n="chat__reasoningEffortDefault">Model default</option>
            <option value="none" data-i18n="chat__reasoningEffortNone">Off</option>
            <option value="low" data-i18n="chat__reasoningEffortLow">Low</option>
            <option value="medium" data-i18n="chat__reasoningEffortMedium">Medium</option>
            <option value="high" data-i18n="chat__reasoningEffortHigh">High</option>
            <option value="max" data-i18n="chat__reasoningEffortMax">Maximum</option>
          </select>
          <span class="chat-settings-value" data-i18n="chat__reasoningHint">Applies to your next message. If rejected, choose Model default.</span>
        </label>
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__customEfforts">Custom thinking levels</span>
          <textarea id="customEffortsInput" rows="2" aria-describedby="customEffortsHelp" placeholder="minimal, xhigh, ultra"></textarea>
          <span id="customEffortsHelp" class="chat-settings-value" data-i18n="chat__customEffortsHelp">Separate values with commas or new lines. Save to add them to the selector; each request sends one selected value.</span>
        </label>
        <button id="saveCustomEffortsBtn" type="button" data-i18n="chat__saveCustomEfforts">Save custom levels</button>
        <span id="customEffortsStatus" class="chat-settings-value" role="status" aria-live="polite"></span>
      </div>
    </div>

    <div class="input-container">
      <div class="composer-field">
        <div id="attachmentTray" class="attachment-tray" hidden></div>
        <div id="composerStatus" class="composer-status" role="status" aria-live="polite" hidden>
          <span class="composer-status-dot" aria-hidden="true"></span>
          <span id="composerStatusText" class="composer-status-text"></span>
          <button id="composerRetryBtn" class="composer-status-retry" type="button" data-i18n="chat__btnRetry" hidden>Retry</button>
        </div>
        <textarea id="messageInput" rows="1" data-i18n-placeholder="chat__inputPlaceholder" placeholder="Ask anything"></textarea>
      </div>
      <input id="attachmentInput" type="file" accept="image/*,.txt,.md" multiple hidden>
      <button id="attachmentBtn" class="attachment-btn" type="button" data-i18n-title="chat__btnAttach" data-i18n-aria-label="chat__btnAttach" title="Attach files" aria-label="Attach files">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.7-9.7a4 4 0 0 1 5.7 5.7l-9.8 9.8a2 2 0 0 1-2.8-2.8l9-9"/></svg>
      </button>
      <button id="sendBtn" class="send-btn" data-i18n-title="chat__btnSend" data-i18n-aria-label="chat__btnSend" title="Send" aria-label="Send">
        <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
        <svg class="stop-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 7h10v10H7z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="dist/chat-window.js"></script>
</body>
</html>
