<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="chat__windowPageTitle">AI Chat Window</title>
  <link rel="stylesheet" href="dist/katex/katex.min.css">
  <link rel="stylesheet" href="chat-window.css">
</head>
<body>
  <div class="chat-container">
    <div class="messages-container" id="messagesContainer">
      <div class="welcome-message">
        <div class="welcome-icon">💬</div>
        <div class="welcome-text" data-i18n="chat__welcome">Start Chatting</div>
        <div class="welcome-hint" data-i18n="chat__welcomeHint">Enter a question to start chatting with AI</div>
      </div>
    </div>

    <div class="chat-settings-panel chat-settings-popover" id="settingsPanel" role="dialog" aria-modal="false" aria-labelledby="settingsPanelTitle" hidden>
      <div class="chat-settings-header">
        <span id="settingsPanelTitle" class="chat-settings-title" data-i18n="content__btnSettings">Settings</span>
        <button id="settingsCloseBtn" class="chat-settings-close" type="button" data-i18n-title="content__btnClose" data-i18n-aria-label="content__btnClose" title="Close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
      <div class="chat-settings-grid">
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__settingsModel">Model</span>
          <select id="profileSelect" data-i18n-title="chat__btnSwitchConfig" title="Switch Config">
            <option value=""></option>
          </select>
        </label>
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__settingsPrompt">Prompt</span>
          <select id="promptSelect">
            <option value="" data-i18n="prompt__noPrompt">No Prompt</option>
          </select>
        </label>
        <label class="chat-settings-toggle" for="searchToggle">
          <input type="checkbox" id="searchToggle">
          <span class="chat-settings-toggle-copy">
            <span class="chat-settings-label" data-i18n="chat__settingsSearch">Search</span>
            <span class="chat-settings-value" data-i18n="chat__searchToggle">Web Search</span>
          </span>
        </label>
        <label class="chat-settings-toggle" for="streamingToggle">
          <input type="checkbox" id="streamingToggle">
          <span class="chat-settings-toggle-copy">
            <span class="chat-settings-label" data-i18n="chat__settingsStreaming">Response</span>
            <span class="chat-settings-value" data-i18n="chat__streamingToggle">Streaming</span>
          </span>
        </label>
        <label class="chat-settings-field">
          <span class="chat-settings-label" data-i18n="chat__settingsContextWindow">Context Window</span>
          <input id="maxContextMessagesInput" type="number" min="0" step="1" data-i18n-placeholder="chat__maxContextMessagesPlaceholder" placeholder="Empty for full history">
        </label>
      </div>
    </div>

    <div class="input-container">
      <div class="composer-field">
        <div id="composerStatus" class="composer-status" role="status" aria-live="polite" hidden>
          <span class="composer-status-dot" aria-hidden="true"></span>
          <span id="composerStatusText" class="composer-status-text"></span>
        </div>
        <textarea id="messageInput" rows="1" data-i18n-placeholder="chat__inputPlaceholder" placeholder="Ask anything"></textarea>
      </div>
      <button id="sendBtn" class="send-btn" data-i18n-title="chat__btnSend" data-i18n-aria-label="chat__btnSend" title="Send" aria-label="Send">
        <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
        <svg class="stop-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 7h10v10H7z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="dist/chat-window.js"></script>
</body>
</html>
